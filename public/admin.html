<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0d0d10" />
<title>주크박스 관리</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #0d0d10; color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro KR", system-ui, sans-serif;
    padding: 20px; min-height: 100vh;
  }
  .wrap { max-width: 880px; margin: 0 auto; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 22px; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
  h1 { font-size: 1.25rem; margin: 0 0 14px; letter-spacing: -0.02em; }
  h2 { font-size: 0.85rem; color: #98989d; text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 10px; }
  .panel { background: #16161c; border: 1px solid #26262e; border-radius: 14px; padding: 16px; }
  .now { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .now img { width: 56px; height: 56px; border-radius: 8px; background: #2a2a32; }
  .now .label { font-size: 0.7rem; color: #ff9f0a; text-transform: uppercase; letter-spacing: 0.06em; }
  .now .title { font-size: 1rem; font-weight: 600; }
  .now .artist { font-size: 0.82rem; color: #98989d; }
  .empty { color: #6b6b70; font-size: 0.9rem; }
  .btn { background: #ff9f0a; color: #1a1a00; border: none; border-radius: 10px; padding: 9px 14px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
  .btn.ghost { background: #1a1a20; color: #f5f5f7; border: 1px solid #2a2a32; }
  .btn.danger { background: #ff453a; color: #fff; }
  .btn:disabled { opacity: 0.4; }
  .skiprow { display: flex; gap: 8px; margin-top: 4px; }
  .queue { list-style: none; margin: 0; padding: 0; }
  .queue li { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; border: 1px solid transparent; }
  .queue li.dragging { opacity: 0.4; }
  .queue li.dragover { border-color: #ff9f0a; }
  .queue img { width: 40px; height: 40px; border-radius: 6px; background: #2a2a32; }
  .queue .info { flex: 1; min-width: 0; }
  .queue .t { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .queue .a { font-size: 0.76rem; color: #98989d; }
  .queue .by { font-size: 0.72rem; color: #6b6b70; }
  .queue .grip { cursor: grab; color: #6b6b70; user-select: none; padding: 0 4px; }
  .queue .del { background: none; border: none; color: #ff453a; cursor: pointer; font-size: 1.1rem; padding: 4px; }
  .field { display: flex; gap: 8px; margin-bottom: 10px; }
  input { flex: 1; background: #1a1a20; border: 1px solid #2a2a32; color: #f5f5f7; border-radius: 10px; padding: 10px 12px; font-size: 0.95rem; outline: none; }
  input:focus { border-color: #ff9f0a; }
  .searchres { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow-y: auto; }
  .searchres li { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid #1c1c22; }
  .searchres img { width: 34px; height: 34px; border-radius: 5px; }
  .searchres .info { flex: 1; min-width: 0; }
  .searchres .t { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .searchres .a { font-size: 0.74rem; color: #98989d; }
  .gate { max-width: 360px; margin: 80px auto; text-align: center; }
  .gate input { width: 100%; margin-bottom: 12px; }
  .note { font-size: 0.78rem; color: #6b6b70; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
<div id="gate" class="gate">
  <h1>🔒 주크박스 관리</h1>
  <input id="tokenInput" type="password" placeholder="관리자 비밀번호" />
  <button class="btn" id="tokenBtn">들어가기</button>
  <div class="note">기본 비밀번호는 <code>bar</code> (환경변수 ADMIN_TOKEN 으로 변경). 비밀번호는 이 브라우저에만 저장됩니다.</div>
</div>

<div id="app" class="wrap" style="display:none">
  <div>
    <h2>지금 재생중</h2>
    <div class="panel">
      <div class="now" id="now"></div>
      <div class="skiprow">
        <button class="btn danger" id="skipBtn">⏭ 스킵 (다음 곡으로)</button>
      </div>
    </div>

    <h2 style="margin-top:18px">대기열 <span id="qcount" style="color:#f5f5f7"></span></h2>
    <div class="panel">
      <ul class="queue" id="queue"></ul>
      <div class="empty" id="qempty">대기열이 비었어요</div>
    </div>
  </div>

  <div>
    <h2>곡 추가 (제한 없음)</h2>
    <div class="panel">
      <div class="field"><input id="q" type="search" placeholder="노래 / 가수 검색" /></div>
      <ul class="searchres" id="searchres"></ul>
    </div>

    <h2 style="margin-top:18px">최근 재생</h2>
    <div class="panel">
      <ul class="queue" id="history"></ul>
      <div class="empty" id="hempty">기록이 없어요</div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem('bj_admin') || '';
let state = null;

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

function authHeaders() { return { 'Content-Type': 'application/json', 'x-admin-token': token }; }
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { ...(opts.headers||{}), 'x-admin-token': token } });
  return r;
}

function showApp() { $('gate').style.display = 'none'; $('app').style.display = 'grid'; refresh(); }
if (token) showApp();
$('tokenBtn').onclick = async () => {
  token = $('tokenInput').value;
  const r = await api('/api/admin/skip', { method: 'POST' });
  if (r.status === 401) { alert('비밀번호가 틀렸어요'); return; }
  localStorage.setItem('bj_admin', token);
  showApp();
};

function songRow(s, draggable) {
  const grip = draggable ? '<span class="grip" title="드래그해서 순서 변경">⠿</span>' : '';
  return `<li data-id="${s.id}" draggable="${draggable}">
    ${grip}<img src="${s.artworkUrl}"/>
    <div class="info"><div class="t">${esc(s.trackName)}</div><div class="a">${esc(s.artistName)}</div></div>
    <span class="by">${esc(s.requestedBy)}</span>
    <button class="del" data-id="${s.id}" title="삭제">✕</button></li>`;
}

function render(s) {
  state = s;
  const np = s.nowPlaying?.song;
  $('now').innerHTML = np
    ? `<img src="${np.artworkUrl}"/><div><div class="label">재생중</div><div class="title">${esc(np.trackName)}</div><div class="artist">${esc(np.artistName)} · ${esc(np.requestedBy)}</div></div>`
    : '<div class="empty">재생중인 곡이 없어요</div>';
  $('skipBtn').disabled = !np;

  const q = $('queue');
  q.innerHTML = s.queue.map(x => songRow(x, true)).join('');
  $('qempty').style.display = s.queue.length ? 'none' : 'block';
  $('qcount').textContent = s.queue.length ? `(${s.queue.length})` : '';

  const h = $('history');
  h.innerHTML = s.history.map(x => songRow(x, false)).join('');
  $('hempty').style.display = s.history.length ? 'none' : 'block';
}

async function refresh() {
  try { render(await (await fetch('/api/state')).json()); } catch {}
}

$('skipBtn').onclick = async () => { await api('/api/admin/skip', { method: 'POST' }); refresh(); };

document.body.addEventListener('click', async (e) => {
  const del = e.target.closest('.queue .del');
  if (del) {
    await api('/api/admin/remove', { method: 'POST', body: JSON.stringify({ id: del.dataset.id }) });
    refresh();
  }
});

// drag-to-reorder on queue
let dragId = null;
$('queue').addEventListener('dragstart', (e) => { dragId = e.target.closest('li')?.dataset.id; e.currentTarget.classList; });
$('queue').addEventListener('dragover', (e) => {
  e.preventDefault();
  const li = e.target.closest('li'); if (!li) return;
  $('queue').querySelectorAll('li').forEach(x => x.classList.remove('dragover'));
  li.classList.add('dragover');
});
$('queue').addEventListener('dragend', () => { $('queue').querySelectorAll('li').forEach(x => x.classList.remove('dragover')); });
$('queue').addEventListener('drop', async (e) => {
  e.preventDefault();
  const li = e.target.closest('li'); if (!li || !dragId) return;
  const ids = [...$('queue').querySelectorAll('li')].map(x => x.dataset.id);
  const from = ids.indexOf(dragId), to = ids.indexOf(li.dataset.id);
  ids.splice(to, 0, ids.splice(from, 1)[0]);
  await api('/api/admin/reorder', { method: 'POST', body: JSON.stringify({ ids }) });
  dragId = null;
  refresh();
});

// search + add (staff)
$('q').addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter') return;
  const r = await (await fetch('/api/search?q=' + encodeURIComponent($('q').value.trim()))).json();
  $('searchres').innerHTML = (r.hits||[]).map(h => `
    <li><img src="${h.artworkUrl}"/><div class="info"><div class="t">${esc(h.trackName)}</div><div class="a">${esc(h.artistName)}</div></div>
    <button class="btn" data-hit='${JSON.stringify(h).replace(/'/g,"&#39;")}'>추가</button></li>`).join('');
});
$('searchres').addEventListener('click', async (e) => {
  const b = e.target.closest('.btn'); if (!b) return;
  const hit = JSON.parse(b.getAttribute('data-hit'));
  await api('/api/admin/add', { method: 'POST', body: JSON.stringify(hit) });
  b.textContent = '✓';
  refresh();
});

setInterval(refresh, 2000);
</script>
</body>
</html>
