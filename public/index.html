<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#000000" />
<title>바 주크박스</title>
<style>
  :root {
    color-scheme: dark;
    --accent: #fa233b;
    --card: #1c1c1e;
    --card2: #2c2c2e;
    --sub: #8e8e93;
    --line: #2a2a2c;
    --spring: cubic-bezier(0.32, 0.72, 0, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #000; color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro KR", "Pretendard", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    max-width: 560px; margin: 0 auto;
    padding: env(safe-area-inset-top) 18px env(safe-area-inset-bottom);
    overflow-x: hidden;
  }
  button { font-family: inherit; }
  .boot {
    height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; color: var(--sub); font-size: 0.95rem;
  }
  .boot .logo { font-size: 2.4rem; }
  .boot.err .logo { filter: grayscale(1); opacity: 0.5; }

  .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 4px; }
  .brand { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
  .brand .note { color: var(--accent); }
  .chip {
    font-size: 0.78rem; font-weight: 700; color: var(--accent);
    border: 1.5px solid var(--accent); border-radius: 999px; padding: 6px 12px;
  }
  .banner {
    display: none; border-radius: 12px; padding: 10px 14px; font-size: 0.85rem; margin-bottom: 12px;
  }
  .banner.show { display: block; }
  .banner.pause { background: rgba(250, 35, 59, 0.14); color: #ff8a96; border: 1px solid rgba(250, 35, 59, 0.35); }
  .banner.notice { background: rgba(255, 159, 10, 0.12); color: #ffc46b; border: 1px solid rgba(255, 159, 10, 0.3); }

  .searchwrap { position: sticky; top: 0; background: linear-gradient(#000 82%, transparent); padding: 8px 0 12px; z-index: 5; }
  .field { display: flex; gap: 8px; }
  input[type=search] {
    flex: 1; background: var(--card); border: 1px solid var(--line); color: #f5f5f7;
    border-radius: 12px; padding: 12px 14px; font-size: 1rem; outline: none;
  }
  input::placeholder { color: #6b6b70; }
  .gobtn {
    background: var(--accent); color: #fff; border: none; border-radius: 12px;
    padding: 0 18px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
  }
  .gobtn:disabled { opacity: 0.4; }
  .hint { color: var(--sub); font-size: 0.85rem; margin: 22px 0; text-align: center; }

  .results { list-style: none; margin: 0; padding: 0 0 140px; }
  .results li {
    display: flex; gap: 12px; align-items: center; padding: 9px 0;
    border-bottom: 1px solid #151517;
  }
  .results img { width: 48px; height: 48px; border-radius: 7px; background: var(--card); object-fit: cover; }
  .results .info { flex: 1; min-width: 0; }
  .results .t { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .results .a { font-size: 0.78rem; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .req {
    background: var(--accent); color: #fff; border: none; border-radius: 999px;
    padding: 8px 16px; font-weight: 700; font-size: 0.85rem; cursor: pointer;
  }
  .req:disabled { background: #333336; color: #6b6b70; }

  /* ── 미니 플레이어 ─────────────────────────── */
  .mini {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(12px + env(safe-area-inset-bottom));
    width: min(calc(100% - 36px), 524px);
    display: none; align-items: center; gap: 11px; text-align: left;
    background: rgba(30, 30, 32, 0.92); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid #2e2e30; border-radius: 16px; padding: 8px 14px 8px 8px;
    cursor: pointer; z-index: 20; box-shadow: 0 10px 30px rgba(0,0,0,0.55);
  }
  .mini.show { display: flex; }
  .mini:active { transform: translateX(-50%) scale(0.98); }
  .mini img { width: 42px; height: 42px; border-radius: 7px; object-fit: cover; background: var(--card); }
  .mini .mi { flex: 1; min-width: 0; }
  .mini .mt { font-size: 0.88rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .ma { font-size: 0.72rem; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eq { display: flex; gap: 2.5px; align-items: flex-end; height: 16px; padding-right: 4px; }
  .eq i { width: 3px; border-radius: 2px; background: var(--accent); animation: eqb 0.9s ease-in-out infinite; }
  .eq i:nth-child(1) { height: 60%; animation-delay: 0s; }
  .eq i:nth-child(2) { height: 100%; animation-delay: 0.25s; }
  .eq i:nth-child(3) { height: 45%; animation-delay: 0.5s; }
  @keyframes eqb { 0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }

  /* ── 풀스크린 시트 ─────────────────────────── */
  .sheet {
    position: fixed; inset: 0; z-index: 30;
    background: #0b0b0d;
    transform: translateY(100%); transition: transform 0.45s var(--spring);
    pointer-events: none;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    overflow-y: auto; max-width: 560px; margin: 0 auto;
  }
  .sheet.open { transform: translateY(0); pointer-events: auto; }
  .grabber {
    display: block; margin: 10px auto 6px; background: none; border: none;
    color: var(--sub); font-size: 1.5rem; cursor: pointer; padding: 4px 28px;
  }
  .nphead { text-align: center; }
  .bigart {
    display: block; width: min(72vw, 300px); aspect-ratio: 1; object-fit: cover;
    border-radius: 12px; margin: 14px auto 20px; background: var(--card);
    box-shadow: 0 22px 48px rgba(0,0,0,0.65);
  }
  .nplabel { font-size: 0.7rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
  .nptitle { font-size: 1.35rem; font-weight: 800; margin: 6px 0 2px; letter-spacing: -0.02em; }
  .npartist { font-size: 0.95rem; color: var(--sub); }
  .npby { display: inline-block; margin-top: 10px; font-size: 0.75rem; color: #d8d8dc; background: var(--card); border-radius: 999px; padding: 5px 12px; }
  .progress { height: 4px; background: #2a2a2c; border-radius: 2px; margin: 26px 0 6px; overflow: hidden; }
  .progress .bar { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width 1s linear; }
  .times { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--sub); font-variant-numeric: tabular-nums; }
  .npempty { color: var(--sub); text-align: center; padding: 80px 0; font-size: 0.95rem; }

  .qtoggle {
    display: flex; width: 100%; align-items: center; justify-content: space-between;
    background: none; border: none; border-top: 1px solid #1c1c1e; margin-top: 26px;
    color: #f5f5f7; font-size: 0.95rem; font-weight: 700; padding: 16px 2px; cursor: pointer;
  }
  .qtoggle .left { display: flex; align-items: center; gap: 8px; }
  .qtoggle .count { color: var(--sub); font-weight: 600; font-size: 0.85rem; }
  .qtoggle .chev { color: var(--sub); transition: transform 0.25s; display: inline-block; }
  .qtoggle.exp .chev { transform: rotate(180deg); }

  .qlist { list-style: none; margin: 0; padding: 0 0 40px; display: none; }
  .qlist.show { display: block; }
  .qlist li {
    display: flex; gap: 11px; align-items: center; padding: 8px 2px;
    border-radius: 10px;
  }
  .qlist li.mine { background: rgba(250, 35, 59, 0.08); padding-left: 8px; padding-right: 8px; }
  .qlist .idx { width: 18px; text-align: center; color: var(--sub); font-size: 0.8rem; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .qlist img { width: 42px; height: 42px; border-radius: 6px; object-fit: cover; background: var(--card); }
  .qlist .info { flex: 1; min-width: 0; }
  .qlist .t { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qlist .a { font-size: 0.74rem; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .minebadge { font-size: 0.65rem; color: var(--accent); font-weight: 800; border: 1px solid var(--accent); padding: 2px 7px; border-radius: 999px; flex-shrink: 0; }
  .cancelx {
    background: none; border: 1px solid #3a3a3c; color: #ff8a96; border-radius: 999px;
    width: 26px; height: 26px; font-size: 0.85rem; cursor: pointer; flex-shrink: 0; line-height: 1;
  }
  .qempty { color: var(--sub); font-size: 0.85rem; padding: 14px 2px 30px; display: none; }
  .qempty.show { display: block; }

  .toast {
    position: fixed; left: 18px; right: 18px; bottom: calc(84px + env(safe-area-inset-bottom));
    background: #2a2a2c; border: 1px solid #3a3a3c; border-radius: 14px; padding: 13px 16px;
    font-size: 0.9rem; text-align: center; z-index: 50;
    transition: opacity 0.3s, transform 0.3s;
  }
  .toast.ok { border-color: #30d158; }
  .toast.err { border-color: #ff453a; }
  .toast.hide { opacity: 0; transform: translateY(10px); pointer-events: none; }
</style>
</head>
<body>
  <div class="boot" id="boot"><div class="logo">🎧</div><div>테이블을 확인하는 중...</div></div>

  <div id="app" style="display:none">
    <header class="top">
      <div class="brand"><span class="note">♪</span> 주크박스</div>
      <div class="chip" id="tableChip"></div>
    </header>
    <div class="banner pause" id="pauseBanner">지금은 곡 신청을 받고 있지 않아요</div>
    <div class="banner notice" id="noticeBanner"></div>

    <div class="searchwrap">
      <div class="field">
        <input id="q" type="search" placeholder="노래, 가수 검색" enterkeyhint="search" autocomplete="off" />
        <button class="gobtn" id="searchBtn">검색</button>
      </div>
    </div>

    <div class="hint" id="hint">신청하고 싶은 곡을 검색해보세요</div>
    <ul class="results" id="results"></ul>
  </div>

  <button class="mini" id="mini" aria-label="재생 화면 열기">
    <img id="miniArt" alt="" />
    <div class="mi">
      <div class="mt" id="miniTitle"></div>
      <div class="ma" id="miniArtist"></div>
    </div>
    <div class="eq"><i></i><i></i><i></i></div>
  </button>

  <div class="sheet" id="sheet">
    <button class="grabber" id="sheetClose" aria-label="닫기">⌄</button>
    <div id="npWrap">
      <div class="nphead">
        <img class="bigart" id="bigArt" alt="" />
        <div class="nplabel">Now Playing</div>
        <div class="nptitle" id="npTitle"></div>
        <div class="npartist" id="npArtist"></div>
        <div class="npby" id="npBy"></div>
      </div>
      <div class="progress"><div class="bar" id="npBar"></div></div>
      <div class="times"><span id="tPos">0:00</span><span id="tDur">-:--</span></div>

      <button class="qtoggle" id="qToggle">
        <span class="left">재생 예정 <span class="count" id="qCount"></span></span>
        <span class="chev">⌃</span>
      </button>
      <div class="qempty" id="qEmpty">대기열이 비었어요 — 첫 곡을 신청해보세요</div>
      <ul class="qlist" id="qList"></ul>
    </div>
  </div>

  <div class="toast hide" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const TABLE_ID = Number(params.get('t'));
const TABLE_SECRET = params.get('k') || '';
let myDevice = null;
let tableLabel = '';
let lastState = null;
let sheetOpen = false;
let pollTimer = null;

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

function toast(msg, kind) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast ' + (kind || '') + ' hide';
  requestAnimationFrame(() => t.classList.remove('hide'));
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add('hide'), 3000);
}

function fmt(sec) {
  if (sec == null || !Number.isFinite(sec)) return '-:--';
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function deviceHasActive(s) {
  if (!myDevice) return false;
  return s.nowPlaying?.song.deviceId === myDevice
    || s.queue.some(x => x.deviceId === myDevice);
}

// ── 부트스트랩: 테이블 QR 검증 ──
async function boot() {
  if (!Number.isInteger(TABLE_ID) || !TABLE_SECRET) {
    bootError('테이블 QR 코드로 접속해주세요');
    return;
  }
  try {
    const r = await fetch('/api/table?t=' + TABLE_ID + '&k=' + encodeURIComponent(TABLE_SECRET));
    if (!r.ok) { bootError('QR 코드가 유효하지 않아요. 직원에게 문의해주세요'); return; }
    const j = await r.json();
    myDevice = j.deviceId;
    tableLabel = j.label;
    $('tableChip').textContent = tableLabel;
    $('boot').style.display = 'none';
    $('app').style.display = 'block';
    connectRealtime();
  } catch {
    bootError('서버에 연결할 수 없어요. WiFi를 확인해주세요');
  }
}
function bootError(msg) {
  const b = $('boot');
  b.classList.add('err');
  b.innerHTML = '<div class="logo">🚫</div><div>' + esc(msg) + '</div>';
}

// ── 실시간: SSE, 실패 시 폴링 폴백 ──
function connectRealtime() {
  const es = new EventSource('/api/events');
  es.addEventListener('state', (e) => {
    try { render(JSON.parse(e.data)); } catch {}
  });
  es.onerror = () => {
    es.close();
    if (pollTimer) return;
    pollTimer = setInterval(refresh, 3000);
  };
}
async function refresh() {
  try { render(await (await fetch('/api/state')).json()); } catch {}
}

// ── 렌더 ──
function render(s) {
  lastState = s;
  const np = s.nowPlaying?.song ?? null;

  $('pauseBanner').classList.toggle('show', !!s.requestsPaused);
  const nb = $('noticeBanner');
  if (s.notice) { nb.textContent = '📢 ' + s.notice; nb.classList.add('show'); }
  else nb.classList.remove('show');

  const mini = $('mini');
  if (np) {
    mini.classList.add('show');
    $('miniArt').src = np.artworkUrl || '';
    $('miniTitle').textContent = np.trackName;
    $('miniArtist').textContent = np.artistName + ' · ' + np.requestedBy;
  } else {
    mini.classList.remove('show');
    if (sheetOpen) closeSheet();
  }

  if (sheetOpen) renderSheet(s);

  $('hint').style.display = s.queue.length ? 'none' : 'block';
  updateRequestButtons();
}

function renderSheet(s) {
  const np = s.nowPlaying;
  $('npWrap').style.display = np ? 'block' : 'none';
  if (np) {
    $('bigArt').src = np.song.artworkUrl || '';
    $('npTitle').textContent = np.song.trackName;
    $('npArtist').textContent = np.song.artistName;
    $('npBy').textContent = np.song.requestedBy + '님이 신청';
    const dur = np.durationSec ?? np.song.durationSec;
    $('npBar').style.width = dur ? Math.min(100, (np.positionSec / dur) * 100) + '%' : '0%';
    $('tPos').textContent = fmt(np.positionSec);
    $('tDur').textContent = fmt(dur);
  }
  const mine = deviceHasActive(s);
  $('qCount').textContent = s.queue.length ? '· ' + s.queue.length + '곡' : '';
  $('qEmpty').classList.toggle('show', !s.queue.length);
  $('qList').innerHTML = s.queue.map((x, i) => {
    const my = x.deviceId === myDevice;
    return '<li' + (my ? ' class="mine"' : '') + '>'
      + '<span class="idx">' + (i + 1) + '</span>'
      + '<img src="' + esc(x.artworkUrl) + '" alt=""/>'
      + '<div class="info"><div class="t">' + esc(x.trackName) + '</div>'
      + '<div class="a">' + esc(x.artistName) + ' · ' + esc(x.requestedBy) + '</div></div>'
      + (my ? '<span class="minebadge">내 신청</span><button class="cancelx" data-id="' + esc(x.id) + '" aria-label="신청 취소">✕</button>' : '')
      + '</li>';
  }).join('');
  renderHint(mine, s.requestsPaused);
}

function renderHint(mine, paused) {
  const h = $('hint');
  if (paused) { h.textContent = '잠시 후에 곡 신청을 받아요'; h.style.display = 'block'; }
  else if (mine) { h.textContent = '신청한 곡이 재생 대기 중이에요. 끝나면 또 신청할 수 있어요'; h.style.display = 'block'; }
  else if (!lastState?.queue.length) { h.textContent = '신청하고 싶은 곡을 검색해보세요'; h.style.display = 'block'; }
  else h.style.display = 'none';
}

function updateRequestButtons() {
  if (!lastState) return;
  const blocked = !!lastState.requestsPaused || deviceHasActive(lastState);
  document.querySelectorAll('.results .req').forEach(b => { b.disabled = blocked; });
}

// ── 시트 열기/닫기 ──
function openSheet() {
  if (!lastState?.nowPlaying) return;
  sheetOpen = true;
  renderSheet(lastState);
  $('sheet').classList.add('open');
}
function closeSheet() {
  sheetOpen = false;
  $('sheet').classList.remove('open');
  $('qToggle').classList.remove('exp');
  $('qList').classList.remove('show');
}
$('mini').addEventListener('click', openSheet);
$('sheetClose').addEventListener('click', closeSheet);
$('qToggle').addEventListener('click', () => {
  $('qToggle').classList.toggle('exp');
  $('qList').classList.toggle('show');
});

// ── 대기열에서 본인 곡 취소 ──
$('qList').addEventListener('click', async (e) => {
  const btn = e.target.closest('.cancelx');
  if (!btn) return;
  btn.disabled = true;
  try {
    const r = await fetch('/api/cancel', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: btn.dataset.id })
    });
    const j = await r.json();
    toast(j.ok ? '신청을 취소했어요' : '취소할 수 없어요', j.ok ? 'ok' : 'err');
    refresh();
  } catch { toast('네트워크 오류', 'err'); btn.disabled = false; }
});

// ── 검색 ──
let searchTimer = null;
$('q').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(doSearch, 450);
});
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
$('searchBtn').addEventListener('click', doSearch);

async function doSearch() {
  const q = $('q').value.trim();
  clearTimeout(searchTimer);
  if (!q) return;
  $('searchBtn').disabled = true;
  try {
    const r = await (await fetch('/api/search?q=' + encodeURIComponent(q))).json();
    if (r.error) { toast(r.error, 'err'); return; }
    if (!r.hits.length) { toast('검색 결과가 없어요', 'err'); return; }
    $('results').innerHTML = r.hits.map(h =>
      '<li>'
      + '<img src="' + esc(h.artworkUrl) + '" alt=""/>'
      + '<div class="info"><div class="t">' + esc(h.trackName) + '</div>'
      + '<div class="a">' + esc(h.artistName) + (h.durationSec ? ' · ' + fmt(h.durationSec) : '') + '</div></div>'
      + '<button class="req" data-hit=\'' + JSON.stringify(h).replace(/'/g, '&#39;') + '\'>신청</button>'
      + '</li>'
    ).join('');
    updateRequestButtons();
  } catch { toast('검색 중 오류가 발생했어요', 'err'); }
  finally { $('searchBtn').disabled = false; }
}

// ── 신청 ──
$('results').addEventListener('click', async (e) => {
  const b = e.target.closest('.req');
  if (!b || b.disabled) return;
  const hit = JSON.parse(b.getAttribute('data-hit'));
  b.disabled = true;
  try {
    const r = await fetch('/api/request', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...hit, tableId: TABLE_ID, tableSecret: TABLE_SECRET })
    });
    const j = await r.json();
    if (!r.ok) { toast(j.error || '신청 실패', 'err'); b.disabled = false; return; }
    toast('신청됐어요! 순서가 오면 틀어줄게요 🎧', 'ok');
    refresh();
  } catch { toast('네트워크 오류', 'err'); b.disabled = false; }
});

boot();
</script>
</body>
</html>
