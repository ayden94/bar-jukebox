<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26262e" />
      <stop offset="1" stop-color="#0c0c10" />
    </linearGradient>
    <radialGradient id="disc" cx="38%" cy="32%" r="78%">
      <stop offset="0" stop-color="#33333c" />
      <stop offset="0.55" stop-color="#18181e" />
      <stop offset="1" stop-color="#0a0a0d" />
    </radialGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff747d" />
      <stop offset="1" stop-color="#d63a45" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="clip">
      <circle cx="90" cy="90" r="66" />
    </clipPath>
  </defs>
  <rect width="180" height="180" rx="38" fill="url(#tile)" />
  <circle cx="90" cy="90" r="66" fill="url(#disc)" />
  <g clip-path="url(#clip)">
    <ellipse
      cx="62"
      cy="52"
      rx="52"
      ry="28"
      fill="url(#shine)"
      transform="rotate(-32 62 52)"
    />
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.09">
    <circle cx="90" cy="90" r="56.5" />
    <circle cx="90" cy="90" r="49" />
    <circle cx="90" cy="90" r="41.5" />
    <circle cx="90" cy="90" r="34" />
  </g>
  <circle cx="90" cy="90" r="24" fill="url(#label)" />
  <circle cx="90" cy="90" r="20.5" fill="none" stroke="#8f1d26" stroke-opacity="0.5" />
  <circle cx="90" cy="90" r="5" fill="#0a0a0d" />
</svg>
